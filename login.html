<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — memory.os</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                     radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                     radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, #030712 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-glow: #6366f1;
      --radius-lg: 24px;
      --radius-sm: 12px;
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    body { background-color: #030712; background-image: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; position: relative; overflow-x: hidden; }

    .liquid-orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; animation: floatOrb 15s ease-in-out infinite alternate; pointer-events: none; }
    .orb-1 { width: 450px; height: 450px; background: rgba(99, 102, 241, 0.25); top: -100px; left: -100px; }
    .orb-2 { width: 500px; height: 500px; background: rgba(168, 85, 247, 0.2); bottom: -150px; right: -100px; animation-delay: -5s; }
    @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, 60px) scale(1.1); } 100% { transform: translate(-30px, 40px) scale(0.95); } }

    .navbar {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1200px;
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: var(--glass-shadow);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); font-weight: 700; font-size: 1.25rem; }
    .nav-brand span { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-secondary); font-size: 0.95rem; font-weight: 500; padding: 8px 16px; border-radius: var(--radius-sm); transition: var(--transition); }
    .nav-links a:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border-hover); }

    .btn-glass {
      background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); color: var(--text-primary);
      padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.95rem; cursor: pointer; text-decoration: none; transition: var(--transition); display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-glass:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--glass-border-hover); transform: translateY(-2px); }

    .btn-primary-glass {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.6), rgba(168, 85, 247, 0.6)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff;
      padding: 10px 22px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.95rem; cursor: pointer; text-decoration: none; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary-glass:hover { background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(168, 85, 247, 0.8)); transform: translateY(-2px); }

    .main-container { max-width: 1200px; margin: 160px auto 80px; padding: 0 20px; }
    .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--glass-shadow); transition: var(--transition); }
    .glass-card:hover { border-color: var(--glass-border-hover); }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
    .form-input {
      width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
      padding: 14px 18px; color: var(--text-primary); font-size: 1rem; outline: none; transition: var(--transition);
    }
    .form-input:focus { border-color: var(--accent-glow); background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
    .footer { text-align: center; padding: 40px 0; color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid var(--glass-border); margin-top: 80px; }
  </style>
</head>
<body>

  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2.5"><defs><linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>memory.os</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="settings.html">Settings</a></li>
    </ul>
    <div class="nav-actions">
      <a href="register.html" class="btn-primary-glass">Get Started</a>
    </div>
  </nav>

  <main class="main-container" style="max-width: 480px;">
    <div class="glass-card">
      <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 8px;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Access your intelligent screenshot memory vault</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" style="accent-color: var(--accent-glow);"> Remember this device
          </label>
          <a href="#" style="color: #a5b4fc; text-decoration: none;">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary-glass" style="width: 100%; padding: 14px; margin-bottom: 20px;">
          Sign In to memory.os
        </button>

        <p style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
          Don't have an account? <a href="register.html" style="color: #a5b4fc; text-decoration: none; font-weight: 600;">Create account</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 memory.os Inc. Secure Encrypted Session.</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Welcome back, ${email}! Loading your encrypted memory vault...`);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
